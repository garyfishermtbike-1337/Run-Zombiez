<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="depotSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#231a12" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#depotSky)" />

  <!-- depot building silhouette -->
  <polygon points="40,260 40,140 200,90 360,140 360,260" fill="#161617" />
  <rect x="150" y="180" width="100" height="80" fill="#0A0A0B" />
  <rect x="60" y="200" width="50" height="60" fill="#0A0A0B" opacity="0.7" />
  <rect x="290" y="200" width="50" height="60" fill="#0A0A0B" opacity="0.7" />

  <!-- warning light on the roof -->
  <circle cx="200" cy="86" r="5" fill="#B0231C" />

  <rect x="0" y="260" width="400" height="40" fill="#0A0A0B" />
</svg>
