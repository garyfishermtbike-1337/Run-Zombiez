<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a10" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D98324" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D98324" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sky2)" />

  <!-- towers pulled open -->
  <polygon points="0,300 0,90 40,70 40,300" fill="#2B2B2E" />
  <polygon points="360,300 360,70 400,90 400,300" fill="#2B2B2E" />

  <!-- open gate doors, swung wide -->
  <polygon points="40,300 40,110 130,130 130,300" fill="#2B2B2E" />
  <polygon points="360,300 360,110 270,130 270,300" fill="#2B2B2E" />

  <!-- road / light spilling through the opening -->
  <polygon points="150,300 250,300 210,150 190,150" fill="url(#road)" />

  <circle cx="20" cy="80" r="5" fill="#D98324" />
  <circle cx="380" cy="80" r="5" fill="#D98324" />

  <rect x="0" y="286" width="400" height="14" fill="#0A0A0B" />
</svg>
